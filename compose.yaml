name: it-tickets
services:
  osticket:
    image: rinkp/osticket-dockerized@sha256:43163dda84304a178f5849eddb0bef2207758bce8b08380b61c3599ce2f9bc47
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      OST_SECRET_SALT: ${OST_SECRET_SALT:?required}
      OST_ADMIN_EMAIL: ${OST_ADMIN_EMAIL:?required}
      OST_ADMIN_PASSWD: ${OST_ADMIN_PASSWD:?required}
      OST_HELPDESK_URL: http://localhost:8080/
      OST_HELPDESK_ONLINE: "true"
      OST_DBHOST: database
      OST_DBNAME: osticket
      OST_DBUSER: osticket
      OST_DBPASS: ${DB_PASSWORD:?required}
      OST_TABLE_PREFIX: ost_
      OST_SESSION_BACKEND: db
      OST_PLUGINS_STORAGEFS_PATH: /var/www/attachments
    volumes:
      - attachments:/var/www/attachments
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
volumes:
  database:
  attachments:
