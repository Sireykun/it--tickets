name: it-tickets
services:
  osticket:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      OST_SECRET_SALT: ${OST_SECRET_SALT:?required}
      OST_ADMIN_EMAIL: ${OST_ADMIN_EMAIL:?required}
      OST_ADMIN_PASSWD: ${OST_ADMIN_PASSWD:?required}
      OST_HELPDESK_URL: ${OST_HELPDESK_URL:-http://localhost:8081/}
      OST_HELPDESK_ONLINE: "true"
      OST_DBHOST: database
      OST_DBNAME: osticket
      OST_DBUSER: osticket
      OST_DBPASS: ${DB_PASSWORD:?required}
      OST_TABLE_PREFIX: ost_
      OST_SESSION_BACKEND: db
      OST_PLUGINS_STORAGEFS_PATH: /var/www/attachments
    volumes:
      - source_attachments:/var/www/attachments
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - source_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
volumes:
  source_database:
  source_attachments:
